<style id="sty">
:root{--bg:#faf6ee;--cd:#fff;--tx:#1d1a14;--mu:#6b6559;--ac:#c8501a;--ln:#e6dfcf;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--cd:#221e17;--tx:#f3eee3;--mu:#a39b8b;--ac:#ee7a3f;--ln:#3a3427}}
:root[data-theme="dark"]{--bg:#17140f;--cd:#221e17;--tx:#f3eee3;--mu:#a39b8b;--ac:#ee7a3f;--ln:#3a3427}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--ac);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:5}
header b{flex:1;font-size:18px}header button{background:#fff3;color:#fff;border:0;border-radius:20px;padding:6px 12px;font-size:14px}
main{padding:14px;max-width:640px;margin:auto}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:14px;text-align:center}
.c .e{font-size:34px}.l{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:14px}h2{margin:6px 0 12px}
button.p,a.p{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-size:15px;text-decoration:none;display:inline-block}
button.s{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:8px 12px}
input,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--cd);color:var(--tx);font-size:16px;margin:4px 0 10px}
.c.r{text-align:left;margin-bottom:10px;cursor:pointer}.t{width:100%;border-collapse:collapse;font-size:14px}.t td,.t th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left}
.box{overflow-x:auto}.vb{background:#2e7d32;color:#fff;border-radius:8px;padding:1px 7px;font-size:12px;margin-left:6px;white-space:nowrap;font-weight:400}
.ci{border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;box-shadow:inset 0 -20px 30px #0003}
.th{width:52px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;margin-right:10px}
.hero{border-radius:16px;padding:20px 16px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#c8501a,#e8a317,#2e7d32)}
.hero b{font-size:22px;display:block}.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.strip div{height:64px;border-radius:10px;background-size:cover;background-position:center}

function bg(c){return IMG[c.id]?`url(${IMG[c.id]}) center/cover`:c.k}
function ic(c){return IMG[c.id]?"":c.e}
function im(c,h){return `<div class="ci" style="height:${h}px;background:${bg(c)};font-size:${h*.55}px">${ic(c)}</div>`}
function jo(){const g=i=>document.getElementById(i).value.trim();if(!g("jn")||!g("jw")){alert("Nom et WhatsApp requis");return}window.open(wa(SUPPORT,"Demande d’inscription vendeur. Boutique : "+g("jn")+" | Centre : "+g("jc")+" | WhatsApp : "+g("jw")+" | Produits : "+g("jp")),"_blank")}
function av(){const g=i=>document.getElementById(i).value.trim();const p=g("ap").split(";").map(s=>s.split("=")).filter(a=>a[0].trim()&&+a[1]).map(a=>[a[0].trim(),+a[1]]);if(!g("an")||!g("aw")||!p.length){alert("Nom, WhatsApp et au moins un produit (Nom=prix)");return}const id=Math.max(1000,...V.map(v=>v.id))+1,w=g("aw").replace(/\D/g,"");sv(()=>ST.add.push({id,c:g("ac"),n:g("an"),w,p}))}
function wa(num,txt){return"https://wa.me/"+num+"?text="+encodeURIComponent(txt)}
let XA=[];try{XA=JSON.parse(localStorage.getItem("gbx")||"[]")}catch(e){}
let KY={};try{KY=JSON.parse(localStorage.getItem("gbk")||"{}")}catch(e){}
function ky(){const g=i=>document.getElementById(i).value.trim();if(!g("kc")){alert("Numéro CNIB requis");return}KY[g("kv")]={n:g("kn"),c:g("kc"),t:g("kt"),d:new Date().toLocaleDateString("fr-FR")};try{localStorage.setItem("gbk",JSON.stringify(KY))}catch(e){}go("admin")}
function kd(i){delete KY[i];try{localStorage.setItem("gbk",JSON.stringify(KY))}catch(e){}go("admin")}
let KP={};try{KP=JSON.parse(localStorage.getItem("gbp")||"{}")}catch(e){}
function kp(i,inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);(KP[i]=KP[i]||[]).push(c.toDataURL("image/jpeg",.6));try{localStorage.setItem("gbp",JSON.stringify(KP))}catch(e){KP[i].pop();alert("Mémoire pleine : supprime d’anciennes photos")}go("admin")};im.src=r.result};r.readAsDataURL(f)}
function kx(i,j){KP[i].splice(j,1);try{localStorage.setItem("gbp",JSON.stringify(KP))}catch(e){}go("admin")}
function sg(i){const r=prompt("Pourquoi signalez-vous ce vendeur ?");if(!r)return;window.open(wa(SUPPORT,"SIGNALEMENT vendeur "+vn(i).n+" (n°"+i+") : "+r),"_blank")}
XA.forEach(a=>{const v=vn(a[0]);if(v)v.p.push([a[1],a[2]])});
function xa(){const g=i=>document.getElementById(i).value.trim(),s=vn(g("xv")),pr=+g("xp"),nm=g("xn").replace(/[|=]/g," ").trim();if(!nm||!(pr>0)){alert("Nom et prix requis");return}if(g("xw").replace(/\D/g,"")!=s.w){alert("Ce numéro n’est pas celui de la boutique");return}window.open(wa(SUPPORT,"GBBF|"+s.id+"|"+nm+"="+pr+"\nNouvel article pour "+s.n+" : "+nm+", "+pr+" FCFA. Merci de le publier."),"_blank")}
function vl(){const l=document.getElementById("vq").value.split("\n").find(l=>l.trim().startsWith("GBBF|"));const t=l?l.trim().split("|"):[];const s=t[1]&&vn(t[1]),a=(t[2]||"").split("="),pr=+a[1];if(!s||!a[0]||!(pr>0)){alert("Demande non reconnue");return}s.p.push([a[0].trim(),pr]);XA.push([s.id,a[0].trim(),pr]);try{localStorage.setItem("gbx",JSON.stringify(XA))}catch(e){}alert("Article ajouté à "+s.n);go("admin")}
function src(){const st=JSON.stringify(ST).replace(/</g,"\\u003c");return '<!doctype html>\n<html lang="fr"><head><meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'+LK+'<title>Grand Bazar BF</title>\n<style id="sty">'+document.getElementById("sty").textContent+'</style></head><body>\n'+document.querySelector("header").outerHTML.replace(/🛒 \d+/,"🛒 0")+'\n<main id="m"></main>\n<script id="st" type="application/json">'+st+'<\/script>\n<script id="app">'+document.getElementById("app").textContent+'<\/script></body></html>'}
async function pb(){try{localStorage.setItem("gbst",JSON.stringify(ST));const b=new Blob([src()],{type:"text/html"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="index.html";document.body.appendChild(a);a.click();a.remove();alert("Fichier index.html téléchargé. Envoie-le sur ton hébergement (Netlify) pour que tous les clients voient le changement.");return true}catch(e){alert("Impossible de préparer le fichier, réessaie.");return false}}
async function sv(f){const sn=JSON.stringify(ST);f();ss("gbgo","admin");if(!(await pb())){ST=JSON.parse(sn);ss("gbgo",null)}else location.reload()}
function vk(i){sv(()=>{const k=ST.vr.indexOf(i);k<0?ST.vr.push(i):ST.vr.splice(k,1)})}
function dv(i){if(!confirm("Supprimer ce vendeur pour tout le monde ?"))return;sv(()=>{ST.add=ST.add.filter(v=>v.id!=i);if(!ST.rm.includes(i))ST.rm.push(i)})}
function hdm(){if(!confirm("Supprimer tous les vendeurs démo ?"))return;sv(()=>{ST.hd=1;ST.rm=[];ST.vr=ST.vr.filter(i=>ST.add.some(v=>v.id==i))})}
function go(v,x){const m=document.getElementById("m");document.getElementById("cb").textContent="🛒 "+cart.length;
let h="";
if(v=="home"){h=`<div class="hero"><b>Le grand marché du Burkina</b>Tout ce qui se vend, au même endroit<div class="strip">${["mar","elec","mode","cuis","chau"].map(k=>`<div style="background-image:url(${IMG[k]})"></div>`).join("")}</div></div><h2>Nos centres</h2><div class="g">${C.map(c=>`<div class="c" onclick="go('center','${c.id}')">${im(c,70)}<b>${c.n}</b><div class="mu">${V.filter(v=>v.c==c.id&&v.on).length} vendeurs</div></div>`).join("")}</div>
<p><a class="p" target="_blank" href="${wa(SUPPORT,"Bonjour, j’ai besoin d’aide sur Grand Bazar BF.")}">💬 Assistance</a> <button class="s" onclick="go('admin')">Espace admin</button></p><p><button class="p" onclick="go('join')">🏪 Devenir vendeur</button></p>`}
if(v=="center"){const c=C.find(c=>c.id==x);h=`${im(c,170)}<h2>${c.n}</h2>`+V.filter(v=>v.c==x&&v.on).map(v=>`<div class="c r" onclick="go('vendor',${v.id})"><b>${v.n}</b>${v.vr?'<span class="vb">✅ Vérifié</span>':''}<div class="mu">${v.p.length} produits · WhatsApp ${v.w}</div></div>`).join("")}
if(v=="vendor"){const s=vn(x);h=`${im(C.find(c=>c.id==s.c),100)}<h2>${s.n}${s.vr?'<span class="vb">✅ Vérifié</span>':''}</h2><p><a class="p" target="_blank" href="${wa(s.w,"Bonjour "+s.n+", je vous contacte via Grand Bazar BF.")}">💬 WhatsApp</a> <a class="p" href="tel:+${s.w}">📞 Appeler</a> <button class="s" onclick="go('addart',${s.id})">➕ Ajouter un article</button> <button class="s" onclick="sg(${s.id})">🚩 Signaler</button></p><p class="mu">Ne payez pas d’avance un vendeur inconnu : préférez le paiement à la livraison ou en main propre.</p>`+s.p.map((p,i)=>`<div class="c r l" style="cursor:default"><span class="th" style="background:${bg(C.find(c=>c.id==s.c))}">${ic(C.find(c=>c.id==s.c))}</span><div style="flex:1"><b>${p[0]}</b><div class="mu">${f(p[1])}</div></div><button class="p" onclick="add(${s.id},${i})">Commander</button></div>`).join("")}
if(v=="cart"){const t=cart.reduce((a,i)=>a+i.pr,0);h=`<h2>Mon panier</h2>`+(cart.length?cart.map((i,k)=>`<div class="c r l" style="cursor:default"><div>${i.n}<div class="mu">${vn(i.v).n} · ${f(i.pr)}</div></div><button class="s" onclick="cart.splice(${k},1);go('cart')">✕</button></div>`).join("")+`<p><b>Total : ${f(t)}</b></p><label>Votre nom</label><input id="nm"><label>Votre numéro</label><input id="ph" inputmode="tel"><p class="mu">Votre commande sera envoyée au vendeur sur WhatsApp. Vous vous arrangez directement avec lui pour le paiement et la livraison.</p><button class="p" onclick="pay()">Envoyer sur WhatsApp</button>`:`<p class="mu">Panier vide.</p>`)}
if(v=="done"){h=`<h2>✅ Commande enregistrée</h2><p class="mu">Envoyez votre commande à chaque vendeur :</p>`+x.map(o=>`<p><a class="p" target="_blank" href="${wa(vn(o.v).w,o.msg)}">💬 ${vn(o.v).n}</a> <a class="p" href="tel:+${vn(o.v).w}">📞 Appeler</a></p>`).join("")}
if(v=="addart"){const s=vn(x);h=`<h2>➕ Nouvel article</h2><p class="mu">Boutique : <b>${s.n}</b>. Remplissez, puis envoyez sur WhatsApp à l’équipe Grand Bazar BF pour publication.</p><input id="xv" type="hidden" value="${s.id}"><label>Nom de l’article</label><input id="xn"><label>Prix (FCFA)</label><input id="xp" inputmode="numeric"><label>Le numéro WhatsApp de votre boutique</label><input id="xw" inputmode="tel"><button class="p" onclick="xa()">Envoyer pour publication</button>`}
if(v=="join"){h=`<h2>🏪 Devenir vendeur</h2><p class="mu">Remplissez, puis envoyez votre demande sur WhatsApp à l’équipe Grand Bazar BF.</p><label>Nom de la boutique</label><input id="jn"><label>Centre</label><select id="jc">${C.map(c=>`<option value="${c.n}">${c.e} ${c.n}</option>`).join("")}</select><label>Votre numéro WhatsApp</label><input id="jw" inputmode="tel"><label>Vos produits ou services</label><input id="jp"><button class="p" onclick="jo()">Envoyer ma demande</button>`}
if(v=="admin"){if(!adm){h=`<h2>Espace admin</h2><label>Code PIN</label><input id="pn" type="password" inputmode="numeric"><button class="p" onclick="if(pn.value==PIN){adm=true;ss('gba','1');go('admin')}else alert('Code incorrect')">Entrer</button>`}
else{const tot=orders.reduce((a,o)=>a+o.t,0);h=`<h2>Tableau de bord</h2><div class="g"><div class="c"><b>${orders.length}</b><div class="mu">commandes</div></div><div class="c"><b>${f(tot)}</b><div class="mu">valeur des commandes</div></div></div><h2>Articles reçus des vendeurs</h2><p class="mu">Collez ici la demande reçue sur WhatsApp.</p><textarea id="vq" rows="3" style="width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--cd);color:var(--tx);font-size:16px;margin:4px 0 10px"></textarea><button class="p" onclick="vl()">Valider l’article</button><h2>Ajouter un vendeur</h2><input id="an" placeholder="Nom de la boutique"><select id="ac">${C.map(c=>`<option value="${c.id}">${c.n}</option>`).join("")}</select><input id="aw" placeholder="WhatsApp (ex. 22670123456)" inputmode="tel"><input id="ap" placeholder="Produits : Riz=1500; Poulet=3000"><button class="p" onclick="av()">Ajouter</button><p class="mu">Après chaque changement, un fichier index.html est téléchargé : envoie-le sur ton hébergement pour que tous voient le changement.</p><button class="s" onclick="hdm()">Supprimer tous les vendeurs démo</button><h2>Vérification des vendeurs</h2><p class="mu">Ces informations restent seulement sur ce téléphone, derrière ton code PIN. Garde les photos des CNIB dans ta galerie ou ton Drive, pas ici.</p><select id="kv">${V.map(v=>`<option value="${v.id}">${v.n}</option>`).join("")}</select><input id="kn" placeholder="Nom sur la CNIB"><input id="kc" placeholder="Numéro de la CNIB"><input id="kt" placeholder="Notes (boutique visitée, référence…)"><button class="p" onclick="ky()">Enregistrer</button>${Object.keys(KY).map(i=>`<div class="c r l" style="cursor:default"><div><b>${vn(i).n}</b><div class="mu">${KY[i].n} · CNIB ${KY[i].c}<br>${KY[i].t||""} · ${KY[i].d}</div></div><button class="s" onclick="kd(${i})">✕</button></div>`).join("")}<h2>Photos des CNIB</h2><p class="mu">Choisis le vendeur, puis ajoute la photo (recto, puis verso si tu veux). Elles restent seulement sur ce téléphone.</p><select id="pv">${V.map(v=>`<option value="${v.id}">${v.n}</option>`).join("")}</select><input type="file" accept="image/*" onchange="kp(pv.value,this)">${Object.keys(KP).filter(i=>KP[i].length).map(i=>`<div class="c r" style="cursor:default"><b>${vn(i).n}</b><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${KP[i].map((p,j)=>`<div><img src="${p}" style="width:90px;border-radius:8px" onclick="this.style.width=this.style.width=='90px'?'260px':'90px'"><br><button class="s" onclick="kx(${i},${j})">✕</button></div>`).join("")}</div></div>`).join("")}<h2>Commandes par vendeur</h2><div class="box"><table class="t"><tr><th>Vendeur</th><th>Centre</th><th>Commandes</th><th>Abonnement</th></tr>${V.map(v=>`<tr><td>${v.n}${v.d?" <span class=\"mu\">(démo)</span>":""}</td><td>${C.find(c=>c.id==v.c).n}</td><td>${f(orders.filter(o=>o.v==v.id).reduce((a,o)=>a+o.t,0))}</td><td>${v.on?"Actif":"Suspendu"}<div class="mu">jusqu’au ${v.ex.toLocaleDateString("fr-FR")}</div><button class="s" onclick="ext(${v.id})">+30 j</button> <button class="s" onclick="tg(${v.id})">${v.on?"Suspendre":"Activer"}</button> <button class="s" onclick="vk(${v.id})">${v.vr?"Retirer ✅":"✅ Vérifier"}</button> <button class="s" onclick="dv(${v.id})">🗑</button></td></tr>`).join("")}</table></div><h2>Dernières commandes</h2>`+(orders.length?orders.map(o=>`<div class="c r" style="cursor:default">${o.cl} · ${o.ph}<div class="mu">${vn(o.v).n} · ${f(o.t)} · ${o.py}</div></div>`).join(""):`<p class="mu">Aucune commande pour l’instant.</p>`)}}
m.innerHTML=h;window.scrollTo(0,0)}
function add(v,i){const p=vn(v).p[i];cart.push({v,n:p[0],pr:p[1]});go("vendor",v)}
function pay(){const nm=document.getElementById("nm").value.trim(),ph=document.getElementById("ph").value.trim(),py="WhatsApp";
if(!nm||!ph){alert("Nom et numéro requis");return}
const by={};cart.forEach(i=>(by[i.v]=by[i.v]||[]).push(i));
const n=Object.keys(by).map(v=>{const it=by[v],t=it.reduce((a,i)=>a+i.pr,0);
const o={v:+v,t,cl:nm,ph,py,msg:"Bonjour, commande Grand Bazar BF de "+nm+" ("+ph+") : "+it.map(i=>i.n).join(", ")+". Total "+f(t)+". Merci de me contacter pour le paiement et la livraison."};orders.push(o);return o});
cart=[];go("done",n)}
go(ss("gbgo")=="admin"?"admin":"home");ss("gbgo",null);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
